<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =====================================================
   BODY
===================================================== */

body {

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: hidden;

    font-family: Arial, sans-serif;

    background: #050712;

    color: white;

    position: relative;

}


/* =====================================================
   BACKGROUND
===================================================== */

.background {

    position: fixed;

    inset: 0;

    overflow: hidden;

    z-index: 0;

    pointer-events: none;

}


/* =====================================================
   ORBS
===================================================== */

.orb {

    position: absolute;

    width: 500px;

    height: 500px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(0,220,255,0.15),
            transparent 68%
        );

    filter: blur(12px);

    animation:
        orbMove 12s infinite alternate ease-in-out;

}


.orb.one {

    left: -180px;

    top: -180px;

}


.orb.two {

    right: -200px;

    bottom: -200px;

    background:
        radial-gradient(
            circle,
            rgba(150,70,255,0.16),
            transparent 68%
        );

    animation-delay: -5s;

}


@keyframes orbMove {

    0% {

        transform:
            translate(0,0)
            scale(1);

    }

    50% {

        transform:
            translate(150px,100px)
            scale(1.15);

    }

    100% {

        transform:
            translate(-50px,200px)
            scale(0.9);

    }

}


/* =====================================================
   RINGS
===================================================== */

.ring {

    position: absolute;

    border:
        1px solid
        rgba(255,255,255,0.07);

    border-radius: 50%;

    animation:
        ringMove linear infinite;

}


.r1 {

    width: 300px;

    height: 300px;

    left: 5%;

    top: 10%;

    animation-duration: 18s;

}


.r2 {

    width: 500px;

    height: 500px;

    right: 2%;

    bottom: -100px;

    animation-duration: 25s;

    animation-direction: reverse;

}


.r3 {

    width: 180px;

    height: 180px;

    right: 18%;

    top: 8%;

    animation-duration: 14s;

}


@keyframes ringMove {

    from {

        transform:
            rotate(0deg)
            scale(1);

    }

    50% {

        transform:
            rotate(180deg)
            scale(1.12);

    }

    to {

        transform:
            rotate(360deg)
            scale(1);

    }

}


/* =====================================================
   FLOATING MATH SYMBOLS
===================================================== */

.math-symbol {

    position: absolute;

    font-size: 24px;

    font-weight: bold;

    opacity: 0.12;

    user-select: none;

    animation:
        mathFloat linear infinite;

}


.s1 {
    left: 8%;
    top: 80%;
    animation-duration: 12s;
}

.s2 {
    left: 18%;
    top: 55%;
    animation-duration: 16s;
    animation-delay: -5s;
}

.s3 {
    left: 32%;
    top: 85%;
    animation-duration: 13s;
    animation-delay: -8s;
}

.s4 {
    left: 48%;
    top: 70%;
    animation-duration: 18s;
    animation-delay: -3s;
}

.s5 {
    left: 65%;
    top: 88%;
    animation-duration: 14s;
    animation-delay: -6s;
}

.s6 {
    left: 78%;
    top: 60%;
    animation-duration: 17s;
    animation-delay: -9s;
}

.s7 {
    left: 90%;
    top: 82%;
    animation-duration: 15s;
    animation-delay: -2s;
}

.s8 {
    left: 25%;
    top: 95%;
    animation-duration: 19s;
    animation-delay: -12s;
}


@keyframes mathFloat {

    0% {

        transform:
            translateY(100px)
            rotate(0deg);

        opacity: 0;

    }

    15% {

        opacity: 0.14;

    }

    50% {

        transform:
            translateY(-250px)
            rotate(180deg);

        opacity: 0.09;

    }

    85% {

        opacity: 0.14;

    }

    100% {

        transform:
            translateY(-650px)
            rotate(360deg);

        opacity: 0;

    }

}


/* =====================================================
   STARS
===================================================== */

.star {

    position: absolute;

    width: 3px;

    height: 3px;

    border-radius: 50%;

    background: white;

    opacity: 0.35;

    animation:
        starPulse 3s infinite ease-in-out;

}


.star:nth-child(1) {
    left: 12%;
    top: 20%;
}

.star:nth-child(2) {
    left: 30%;
    top: 15%;
    animation-delay: 1s;
}

.star:nth-child(3) {
    left: 70%;
    top: 20%;
    animation-delay: 0.5s;
}

.star:nth-child(4) {
    left: 86%;
    top: 35%;
    animation-delay: 1.5s;
}

.star:nth-child(5) {
    left: 15%;
    top: 70%;
    animation-delay: 2s;
}

.star:nth-child(6) {
    left: 80%;
    top: 75%;
    animation-delay: 0.8s;
}


@keyframes starPulse {

    0%,100% {

        transform: scale(0.5);

        opacity: 0.15;

    }

    50% {

        transform: scale(1.8);

        opacity: 0.55;

    }

}

.calculator {

}


@keyframes calculatorIn {

    from {

        opacity: 0;

            translateY(80px)

            rotateX(15deg);

    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1)
            rotateX(0);

    }

}


/* =====================================================
   TOP
===================================================== */

.top {

}

.dot {

    }

}


/* =====================================================
   DISPLAY
===================================================== */

.display-box {

    padding: 17px;

    background:

    border:

.display {

}


.display.pop {

@keyframes numberPop {

    }

/* =====================================================

===================================================== */

.buttons {

}


.buttons button {

.operator {

.zero {

.history {

.history-list {

/* =====================================================
   ELEMENTS
===================================================== */

const display =
    document.getElementById("display");

const previous =
    document.getElementById("previous");

const historyList =
    document.getElementById("historyList");


/* =====================================================
   HISTORY STORAGE
===================================================== */

let calculationHistory =
    JSON.parse(
        localStorage.getItem(
            "abhi7sCalculatorHistory"
        )
    ) || [];


/* =====================================================
   DISPLAY ANIMATION
===================================================== */

function animateDisplay() {

    display.classList.remove("pop");

    void display.offsetWidth;

    display.classList.add("pop");

}


/* =====================================================
   ADD VALUE
===================================================== */

function addToDisplay(value) {


    if (
        display.value === "Error"
    ) {

        display.value = "0";

    }


    if (
        display.value === "0"
    ) {

        display.value = value;

    }

    else {

        display.value += value;

    }


    animateDisplay();

}


/* =====================================================
   CLEAR CURRENT DISPLAY
===================================================== */

function clearDisplay() {

    display.value = "0";

    previous.textContent = "";

    animateDisplay();

}


/* =====================================================
   DELETE
===================================================== */

function deleteNumber() {


    if (
        display.value.length > 1
    ) {

        display.value =
            display.value.slice(0,-1);

    }

    else {

        display.value = "0";

    }


    animateDisplay();

}


/* =====================================================
   CALCULATE
===================================================== */

function calculate() {


    try {


        const expression =
            display.value;


        const result =
            eval(expression);


        if (
            !isFinite(result)
        ) {

            throw new Error();

        }


        previous.textContent =
            expression + " =";


        display.value =
            result;


        /* Save history */

        calculationHistory.unshift({

            expression:
                expression,

            result:
                result,

            time:
                new Date().toLocaleTimeString()

        });


        /* Keep last 20 */

        calculationHistory =
            calculationHistory.slice(
                0,
                20
            );


        localStorage.setItem(

            "abhi7sCalculatorHistory",

            JSON.stringify(
                calculationHistory
            )

        );


        renderHistory();


        animateDisplay();

    }


    catch {


        display.value =
            "Error";


        animateDisplay();

    }

}


/* =====================================================
   SHOW HISTORY
===================================================== */

function renderHistory() {


    historyList.innerHTML = "";


    if (
        calculationHistory.length === 0
    ) {

        historyList.innerHTML =

            '<div class="empty-history">' +

            'No calculation history' +

            '</div>';

        return;

    }


    calculationHistory.forEach(
        function(item) {


            const row =
                document.createElement("div");


            row.className =
                "history-item";


            row.innerHTML =

                '<span class="history-expression">' +

                escapeHTML(
                    item.expression
                ) +

                '</span>' +

                '<span class="history-result">' +

                '=' +

                ' ' +

                escapeHTML(
                    String(item.result)
                ) +

                '</span>';


            historyList.appendChild(row);

        }
    );

}


/* =====================================================
   RESET HISTORY
===================================================== */

function resetHistory() {


    if (
        calculationHistory.length === 0
    ) {

        return;

    }


    const confirmReset =
        confirm(
            "Reset all calculation history?"
        );


    if (
        !confirmReset
    ) {

        return;

    }


    calculationHistory = [];


    localStorage.removeItem(
        "abhi7sCalculatorHistory"
    );


    renderHistory();

}


/* =====================================================
   SAFE TEXT
===================================================== */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}


/* =====================================================
   KEYBOARD SUPPORT
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {


        const key =
            event.key;


        if (

            key >= "0" &&
            key <= "9"

        ) {

            addToDisplay(key);

        }


        else if (

            key === "+" ||
            key === "-" ||
            key === "*" ||
            key === "/" ||
            key === "%"

        ) {

            addToDisplay(key);

        }


        else if (
            key === "."
        ) {

            addToDisplay(".");

        }


        else if (
            key === "Enter"
        ) {

            calculate();

        }


        else if (
            key === "Backspace"
        ) {

            deleteNumber();

        }


        else if (
            key === "Escape"
        ) {

            clearDisplay();

        }

    }
);


/* =====================================================
   SHARE
===================================================== */

async function shareCalculator() {


    const calculatorURL =
        "https://abhi117-cyber.github.io/abhi7s-calculator/";


    const shareData = {

        title:
            "ABHI7S CALCULATOR",

        text:
            "🧮 Try ABHI7S CALCULATOR — Crafted by ABHISHEK YADAV",

        url:
            calculatorURL

    };


    try {


        if (
            navigator.share
        ) {

            await navigator.share(
                shareData
            );

        }


        else if (
            navigator.clipboard
        ) {

            await navigator.clipboard.writeText(
                calculatorURL
            );


            alert(
                "Calculator link copied! 🔗"
            );

        }


        else {

            prompt(
                "Copy Calculator link:",
                calculatorURL
            );

        }

    }


    catch {

        console.log(
            "Share cancelled."
        );

    }

}


/* =====================================================
   LOAD HISTORY
===================================================== */

renderHistory();

</script>
