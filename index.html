<!DOCTYPE html>

<head>

<style>

/* ================================
   RESET
================================ */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* ================================
   BODY
================================ */

body {

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: hidden;

    font-family: Arial, sans-serif;

    background: #050712;

    color: white;

    position: relative;

}


/* ================================
   BACKGROUND
================================ */

.background {

    position: fixed;

    inset: 0;

    overflow: hidden;

    z-index: 0;

    pointer-events: none;

}


/* ================================
   GLOW ORBS
================================ */

.orb {

    position: absolute;

    width: 500px;

    height: 500px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(0,220,255,0.15),
            transparent 68%
        );

    filter: blur(10px);

    animation:
        orbMove 12s infinite alternate ease-in-out;

}

.orb.one {

    left: -180px;

    top: -180px;

}

.orb.two {

    right: -200px;

    bottom: -200px;

    background:
        radial-gradient(
            circle,
            rgba(150,70,255,0.15),
            transparent 68%
        );

    animation-delay: -5s;

}


@keyframes orbMove {

    0% {

        transform:
            translate(0,0)
            scale(1);

    }

    50% {

        transform:
            translate(150px,100px)
            scale(1.15);

    }

    100% {

        transform:
            translate(-50px,200px)
            scale(0.9);

    }

}


/* ================================
   RINGS
================================ */

.ring {

    position: absolute;

    border:
        1px solid
        rgba(255,255,255,0.07);

    border-radius: 50%;

    animation:
        ringMove linear infinite;

}

.r1 {

    width: 300px;

    height: 300px;

    left: 5%;

    top: 10%;

    animation-duration: 18s;

}

.r2 {

    width: 500px;

    height: 500px;

    right: 2%;

    bottom: -100px;

    animation-duration: 25s;

    animation-direction: reverse;

}

.r3 {

    width: 180px;

    height: 180px;

    right: 18%;

    top: 8%;

    animation-duration: 14s;

}


@keyframes ringMove {

    from {

        transform:
            rotate(0deg)
            scale(1);

    }

    50% {

        transform:
            rotate(180deg)
            scale(1.12);

    }

    to {

        transform:
            rotate(360deg)
            scale(1);

    }

}


/* ================================
   FLOATING MATH SYMBOLS
================================ */

.math-symbol {

    position: absolute;

    font-size: 24px;

    font-weight: bold;

    opacity: 0.12;

    user-select: none;

    animation:
        mathFloat linear infinite;

}


.s1 {
    left: 8%;
    top: 80%;
    animation-duration: 12s;
}

.s2 {
    left: 18%;
    top: 55%;
    animation-duration: 16s;
    animation-delay: -5s;
}

.s3 {
    left: 32%;
    top: 85%;
    animation-duration: 13s;
    animation-delay: -8s;
}

.s4 {
    left: 48%;
    top: 70%;
    animation-duration: 18s;
    animation-delay: -3s;
}

.s5 {
    left: 65%;
    top: 88%;
    animation-duration: 14s;
    animation-delay: -6s;
}

.s6 {
    left: 78%;
    top: 60%;
    animation-duration: 17s;
    animation-delay: -9s;
}

.s7 {
    left: 90%;
    top: 82%;
    animation-duration: 15s;
    animation-delay: -2s;
}

.s8 {
    left: 25%;
    top: 95%;
    animation-duration: 19s;
    animation-delay: -12s;
}


@keyframes mathFloat {

    0% {

        transform:
            translateY(100px)
            rotate(0deg);

        opacity: 0;

    }

    15% {

        opacity: 0.14;

    }

    50% {

        transform:
            translateY(-250px)
            rotate(180deg);

        opacity: 0.09;

    }

    85% {

        opacity: 0.14;

    }

    100% {

        transform:
            translateY(-650px)

        opacity: 0;

    }

}


/* ================================
   STARS
================================ */

.star {

    position: absolute;

    width: 3px;

    height: 3px;

    border-radius: 50%;

    background: white;

    opacity: 0.35;

    animation:
        starPulse 3s infinite ease-in-out;

}


.star:nth-child(1) {
    left: 12%;
    top: 20%;
}

.star:nth-child(2) {

    top: 15%;

}

.star:nth-child(3) {

}

.star:nth-child(4) {

}

.star:nth-child(5) {

}

.star:nth-child(6) {

    top: 75%;

}


@keyframes starPulse {

@keyframes calculatorIn {

    to {

}


/* ================================
   TOP
================================ */

.top {

.logo {

@keyframes logoFloat {

@keyframes creatorGlow {

.display-box {

}


/* ================================
   BUTTONS
================================ */

button {

button:hover {

}


/* ================================
   RIPPLE
================================ */

button::after {

    content: "";

    position: absolute;

    width: 10px;

    height: 10px;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.6);

    left: 50%;

    top: 50%;

    transform:

    opacity: 0;

}


button:active::after {

@keyframes ripple {

/* ================================

.zero {

}


/* ================================

.history {

/* ================================

@media (max-width: 600px) {

    }

}

</style>

<script>


/* =========================================
   ELEMENTS
========================================= */

const display =
    document.getElementById("display");

const previous =
    document.getElementById("previous");

const history =
    document.getElementById("history");


/* =========================================
   DISPLAY ANIMATION
========================================= */

function animateDisplay() {

    display.classList.remove("pop");

    void display.offsetWidth;

    display.classList.add("pop");

}


/* =========================================
   ADD NUMBER / OPERATOR
========================================= */

function addToDisplay(value) {


    if (display.value === "Error") {

        display.value = "0";

    }


    if (display.value === "0") {

        display.value = value;

    }

    else {

        display.value += value;

    }


    animateDisplay();

}


/* =========================================
   CLEAR
========================================= */

function clearDisplay() {

    display.value = "0";

    previous.textContent = "";

    history.textContent =
        "No calculation yet";

    animateDisplay();

}


/* =========================================
   DELETE
========================================= */

function deleteNumber() {


    if (
        display.value.length > 1
    ) {

        display.value =
            display.value.slice(0,-1);

    }

    else {

        display.value = "0";

    }


    animateDisplay();

}


/* =========================================
   CALCULATE
========================================= */

function calculate() {


    try {

        const expression =
            display.value;


        const result =
            eval(expression);


        previous.textContent =
            expression + " =";


        history.textContent =
            expression +
            " = " +
            result;


        display.value =
            result;


        animateDisplay();

    }

    catch {

        display.value =
            "Error";

        animateDisplay();

    }

}


/* =========================================
   KEYBOARD SUPPORT
========================================= */

document.addEventListener(
    "keydown",
    function(event) {


        const key =
            event.key;


        if (
            key >= "0" &&
            key <= "9"
        ) {

            addToDisplay(key);

        }


        else if (

            key === "+" ||
            key === "-" ||
            key === "*" ||
            key === "/" ||
            key === "%"

        ) {

            addToDisplay(key);

        }


        else if (
            key === "."
        ) {

            addToDisplay(".");

        }


        else if (
            key === "Enter"
        ) {

            calculate();

        }


        else if (
            key === "Backspace"
        ) {

            deleteNumber();

        }


        else if (
            key === "Escape"
        ) {

            clearDisplay();

        }

    }
);


/* =========================================
   SHARE ABHI7S CALCULATOR
========================================= */

async function shareCalculator() {


    const calculatorURL =
        "https://abhi117-cyber.github.io/abhi7s-calculator/";


    const shareData = {

        title:
            "ABHI7S CALCULATOR",

        text:
            "🧮 Try ABHI7S CALCULATOR — Crafted by ABHISHEK YADAV",

        url:
            calculatorURL

    };


    try {


        /* Mobile / supported browsers */

        if (navigator.share) {

            await navigator.share(
                shareData
            );

        }


        /* Desktop fallback */

        else if (
            navigator.clipboard
        ) {

            await navigator.clipboard.writeText(
                calculatorURL
            );

            showShareMessage(
                "Calculator link copied! 🔗"
            );

        }


        /* Last fallback */

        else {

            prompt(
                "Copy this Calculator link:",
                calculatorURL
            );

        }

    }

    catch (error) {

        console.log(
            "Share cancelled."
        );

    }

}


/* =========================================
   SHARE MESSAGE
========================================= */

function showShareMessage(message) {


    const box =
        document.createElement("div");


    box.textContent =
        message;


    box.style.position =
        "fixed";

    box.style.bottom =
        "85px";

    box.style.right =
        "25px";

    box.style.padding =
        "12px 18px";

    box.style.borderRadius =
        "15px";

    box.style.background =
        "rgba(20,25,45,0.95)";

    box.style.border =
        "1px solid rgba(92,236,255,0.4)";

    box.style.color =
        "white";

    box.style.fontSize =
        "12px";

    box.style.zIndex =
        "100";

    box.style.boxShadow =
        "0 0 25px rgba(0,220,255,0.2)";
